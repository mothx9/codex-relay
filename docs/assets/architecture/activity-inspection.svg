<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640">
<title>Activity inspection</title><desc>One group. Consistent rows. A specific destination for each tap.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#8394aa" stroke-width="1.5"/></marker></defs>
<style>
.ink { fill: #20252c; } .muted { fill: #566273; } .panel { fill: #f3f5f7; }
@media (prefers-color-scheme: dark) { .ink { fill: #f0f2f3; } .muted { fill: #afb5bf; } .panel { fill: #222830; } }
</style>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
<text x="40" y="50" class="ink" font-size="26" font-weight="700">Activity inspection</text>
<text x="40" y="81" class="muted" font-size="15">One group. Consistent rows. A specific destination for each tap.</text>
<rect x="350" y="125" width="300" height="82" rx="14" class="panel" stroke="#8394aa" stroke-width="1.5"/>
<text x="368" y="155" class="ink" font-size="18" font-weight="600">Inline group</text>
<text x="368" y="183" class="muted" font-size="14">Counts · state · recent rows</text>
<rect x="40" y="340" width="270" height="104" rx="14" class="panel" stroke="#8394aa" stroke-width="1.5"/>
<text x="58" y="370" class="ink" font-size="18" font-weight="600">Command / tool</text>
<text x="58" y="398" class="muted" font-size="14">One operation</text>
<text x="58" y="420" class="muted" font-size="14">Available output · copy actions</text>
<rect x="365" y="340" width="270" height="104" rx="14" class="panel" stroke="#8394aa" stroke-width="1.5"/>
<text x="383" y="370" class="ink" font-size="18" font-weight="600">Changed files</text>
<text x="383" y="398" class="muted" font-size="14">Only this group&#x27;s files</text>
<text x="383" y="420" class="muted" font-size="14">Choose one file → its patch</text>
<rect x="690" y="340" width="270" height="104" rx="14" class="panel" stroke="#8394aa" stroke-width="1.5"/>
<text x="708" y="370" class="ink" font-size="18" font-weight="600">All activities</text>
<text x="708" y="398" class="muted" font-size="14">Compact list for this group</text>
<text x="708" y="420" class="muted" font-size="14">Choose one operation → detail</text>
<path d="M 500 229 V 280 H 175 V 332" fill="none" stroke="#8394aa" stroke-width="2" marker-end="url(#arrow)"/>
<text x="230" y="265" class="muted" font-size="14" text-anchor="middle">operation row</text>
<path d="M 500 229 V 332" fill="none" stroke="#8394aa" stroke-width="2" marker-end="url(#arrow)"/>
<text x="565" y="298" class="muted" font-size="14" text-anchor="middle">file preview</text>
<path d="M 500 229 V 280 H 825 V 332" fill="none" stroke="#8394aa" stroke-width="2" marker-end="url(#arrow)"/>
<text x="765" y="265" class="muted" font-size="14" text-anchor="middle">View all</text>
<text x="40" y="545" class="muted" font-size="14">Expansion replaces the collapsed preview. Outputs and patches open on demand.</text>
<text x="40" y="575" class="muted" font-size="14">Group identity follows the first operation; messages and turn boundaries remain intact.</text>
</g></svg>
