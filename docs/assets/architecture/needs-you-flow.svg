<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
<title>Needs You: one canonical request</title><desc>Visibility does not depend on an open conversation.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#8394aa" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="620" rx="24" fill="#15181c"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
<text x="40" y="50" fill="#f0f2f3" font-size="26" font-weight="700">Needs You: one canonical request</text>
<text x="40" y="81" fill="#afb5bf" font-size="15">Visibility does not depend on an open conversation.</text>
<rect x="40" y="140" width="260" height="82" rx="14" fill="#222830" stroke="#8394aa" stroke-width="1.5"/>
<text x="58" y="170" fill="#f0f2f3" font-size="18" font-weight="600">Codex request</text>
<text x="58" y="198" fill="#afb5bf" font-size="14">Supported unresolved request</text>
<rect x="370" y="140" width="260" height="82" rx="14" fill="#222830" stroke="#8394aa" stroke-width="1.5"/>
<text x="388" y="170" fill="#f0f2f3" font-size="18" font-weight="600">Agent</text>
<text x="388" y="198" fill="#afb5bf" font-size="14">Observe · normalize · replay</text>
<rect x="700" y="140" width="260" height="82" rx="14" fill="#222830" stroke="#8394aa" stroke-width="1.5"/>
<text x="718" y="170" fill="#f0f2f3" font-size="18" font-weight="600">Hub request store</text>
<text x="718" y="198" fill="#afb5bf" font-size="14">One identity and incarnation</text>
<path d="M 300 181 H 362" fill="none" stroke="#8394aa" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 630 181 H 692" fill="none" stroke="#8394aa" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="340" width="260" height="82" rx="14" fill="#222830" stroke="#8394aa" stroke-width="1.5"/>
<text x="58" y="370" fill="#f0f2f3" font-size="18" font-weight="600">Fleet + Inbox</text>
<text x="58" y="398" fill="#afb5bf" font-size="14">Derived from the same request</text>
<path d="M 830 222 V 286 H 170 V 332" fill="none" stroke="#8394aa" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="370" y="340" width="260" height="82" rx="14" fill="#222830" stroke="#8394aa" stroke-width="1.5"/>
<text x="388" y="370" fill="#f0f2f3" font-size="18" font-weight="600">Inline conversation</text>
<text x="388" y="398" fill="#afb5bf" font-size="14">Derived from the same request</text>
<path d="M 830 222 V 286 H 500 V 332" fill="none" stroke="#8394aa" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="700" y="340" width="260" height="82" rx="14" fill="#222830" stroke="#8394aa" stroke-width="1.5"/>
<text x="718" y="370" fill="#f0f2f3" font-size="18" font-weight="600">Notification routing</text>
<text x="718" y="398" fill="#afb5bf" font-size="14">Derived from the same request</text>
<path d="M 830 222 V 286 H 830 V 332" fill="none" stroke="#8394aa" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="495" fill="#afb5bf" font-size="14">Answer is one-shot and currentness-gated. A push tap never grants approval.</text>
<text x="40" y="525" fill="#afb5bf" font-size="14">Codex resolution elsewhere removes the request from every surface.</text>
<text x="40" y="555" fill="#afb5bf" font-size="14">History pagination and controller disconnect cannot dismiss pending work.</text>
</g></svg>
