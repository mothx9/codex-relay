<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650">
<title>Two notification paths</title><desc>Permission is separate from delivery readiness.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#8394aa" stroke-width="1.5"/></marker></defs>
<style>
.ink { fill: #20252c; } .muted { fill: #566273; } .panel { fill: #f3f5f7; }
@media (prefers-color-scheme: dark) { .ink { fill: #f0f2f3; } .muted { fill: #afb5bf; } .panel { fill: #222830; } }
</style>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
<text x="40" y="50" class="ink" font-size="26" font-weight="700">Two notification paths</text>
<text x="40" y="81" class="muted" font-size="15">Permission is separate from delivery readiness.</text>
<rect x="40" y="145" width="420" height="126" rx="14" class="panel" stroke="#8394aa" stroke-width="1.5"/>
<text x="58" y="175" class="ink" font-size="18" font-weight="600">Connected local alerts</text>
<text x="58" y="203" class="muted" font-size="14">Native controller observes a live event</text>
<text x="58" y="225" class="muted" font-size="14">Semantic dedupe + currentness guard</text>
<text x="58" y="247" class="muted" font-size="14">UNUserNotificationCenter banner</text>
<rect x="540" y="145" width="420" height="126" rx="14" class="panel" stroke="#8394aa" stroke-width="1.5"/>
<text x="558" y="175" class="ink" font-size="18" font-weight="600">Remote APNs push</text>
<text x="558" y="203" class="muted" font-size="14">Hub observes a live event</text>
<text x="558" y="225" class="muted" font-size="14">Apple entitlement + provider key + registration</text>
<text x="558" y="247" class="muted" font-size="14">APNs delivers while app is not connected</text>
<path d="M 250 271 V 340 H 500 V 370" fill="none" stroke="#8394aa" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 750 271 V 340 H 500 V 370" fill="none" stroke="#8394aa" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="300" y="380" width="400" height="104" rx="14" class="panel" stroke="#8394aa" stroke-width="1.5"/>
<text x="318" y="410" class="ink" font-size="18" font-weight="600">Safe navigation</text>
<text x="318" y="438" class="muted" font-size="14">Tap waits for authentication and current state</text>
<text x="318" y="460" class="muted" font-size="14">Never approves from a payload</text>
<text x="40" y="550" class="muted" font-size="14">Private content omitted. Active-session completion is quiet. No per-token notices.</text>
<text x="40" y="580" class="muted" font-size="14">Local alerts are best effort while connected; they do not replace APNs.</text>
</g></svg>
