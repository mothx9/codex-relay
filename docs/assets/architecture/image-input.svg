<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<title>Images follow the same control path</title><desc>Bounded ephemeral input; no Relay image database.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#8394aa" stroke-width="1.5"/></marker></defs>
<style>
.ink { fill: #20252c; } .muted { fill: #566273; } .panel { fill: #f3f5f7; }
@media (prefers-color-scheme: dark) { .ink { fill: #f0f2f3; } .muted { fill: #afb5bf; } .panel { fill: #222830; } }
</style>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
<text x="40" y="50" class="ink" font-size="26" font-weight="700">Images follow the same control path</text>
<text x="40" y="81" class="muted" font-size="15">Bounded ephemeral input; no Relay image database.</text>
<rect x="40" y="155" width="270" height="126" rx="14" class="panel" stroke="#8394aa" stroke-width="1.5"/>
<text x="58" y="185" class="ink" font-size="18" font-weight="600">iPhone</text>
<text x="58" y="213" class="muted" font-size="14">System photo picker / image drop</text>
<text x="58" y="235" class="muted" font-size="14">Downscale and strip metadata</text>
<text x="58" y="257" class="muted" font-size="14">Up to 2 images · 256 KiB each</text>
<rect x="365" y="155" width="270" height="126" rx="14" class="panel" stroke="#8394aa" stroke-width="1.5"/>
<text x="383" y="185" class="ink" font-size="18" font-weight="600">Canonical Hub</text>
<text x="383" y="213" class="muted" font-size="14">Authorize controller + capability</text>
<text x="383" y="235" class="muted" font-size="14">Validate size, type and dimensions</text>
<text x="383" y="257" class="muted" font-size="14">Route without persistence</text>
<rect x="690" y="155" width="270" height="126" rx="14" class="panel" stroke="#8394aa" stroke-width="1.5"/>
<text x="708" y="185" class="ink" font-size="18" font-weight="600">Agent + Codex</text>
<text x="708" y="213" class="muted" font-size="14">Map to official image input</text>
<text x="708" y="235" class="muted" font-size="14">Preserve turn/client identity</text>
<text x="708" y="257" class="muted" font-size="14">New Turn / Follow-up / Steer</text>
<path d="M 310 230 H 357" fill="none" stroke="#8394aa" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 635 230 H 682" fill="none" stroke="#8394aa" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="390" class="muted" font-size="14">Only JPEG/PNG bytes cross Relay. No URL fetch, remote file path, audio or video.</text>
<text x="40" y="420" class="muted" font-size="14">Codex owns history. Relay history carries attachment counts, not image payloads.</text>
<text x="40" y="450" class="muted" font-size="14">Unknown outcome retains the local draft. No automatic retry or resubmission.</text>
</g></svg>
