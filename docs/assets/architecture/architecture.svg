<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760">
<title>One Hub. Your Codex fleet.</title><desc>The iPhone controls Relay. Codex remains the source of truth.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#8394aa" stroke-width="1.5"/></marker></defs>
<style>
.ink { fill: #20252c; } .muted { fill: #566273; } .panel { fill: #f3f5f7; }
@media (prefers-color-scheme: dark) { .ink { fill: #f0f2f3; } .muted { fill: #afb5bf; } .panel { fill: #222830; } }
</style>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
<text x="40" y="50" class="ink" font-size="26" font-weight="700">One Hub. Your Codex fleet.</text>
<text x="40" y="81" class="muted" font-size="15">The iPhone controls Relay. Codex remains the source of truth.</text>
<rect x="360" y="112" width="280" height="82" rx="14" class="panel" stroke="#8394aa" stroke-width="1.5"/>
<text x="378" y="142" class="ink" font-size="18" font-weight="600">iPhone controller</text>
<text x="378" y="170" class="muted" font-size="14">Live work · decisions · conversation</text>
<path d="M 500 194 V 257" fill="none" stroke="#8394aa" stroke-width="2" marker-end="url(#arrow)"/>
<text x="620" y="231" class="muted" font-size="14" text-anchor="middle">HTTPS / WSS</text>
<rect x="340" y="268" width="320" height="104" rx="14" class="panel" stroke="#8394aa" stroke-width="1.5"/>
<text x="358" y="298" class="ink" font-size="18" font-weight="600">Relay Hub</text>
<text x="358" y="326" class="muted" font-size="14">Fleet state · routing · controllers</text>
<text x="358" y="348" class="muted" font-size="14">SQLite metadata · notifications</text>
<rect x="40" y="460" width="270" height="104" rx="14" class="panel" stroke="#8394aa" stroke-width="1.5"/>
<text x="58" y="490" class="ink" font-size="18" font-weight="600">Linux workstation</text>
<text x="58" y="518" class="muted" font-size="14">Relay Agent</text>
<text x="58" y="540" class="muted" font-size="14">Local Codex shared daemon</text>
<path d="M 175 460 V 410 H 500 V 372" fill="none" stroke="#8394aa" stroke-width="2" marker-end="url(#arrow)"/>
<text x="56" y="596" class="muted" font-size="14">Codex login and execution stay local</text>
<rect x="365" y="460" width="270" height="104" rx="14" class="panel" stroke="#8394aa" stroke-width="1.5"/>
<text x="383" y="490" class="ink" font-size="18" font-weight="600">GPU node</text>
<text x="383" y="518" class="muted" font-size="14">Relay Agent</text>
<text x="383" y="540" class="muted" font-size="14">Local Codex shared daemon</text>
<path d="M 500 460 V 410 H 500 V 372" fill="none" stroke="#8394aa" stroke-width="2" marker-end="url(#arrow)"/>
<text x="381" y="596" class="muted" font-size="14">Codex login and execution stay local</text>
<rect x="690" y="460" width="270" height="104" rx="14" class="panel" stroke="#8394aa" stroke-width="1.5"/>
<text x="708" y="490" class="ink" font-size="18" font-weight="600">macOS laptop</text>
<text x="708" y="518" class="muted" font-size="14">Relay Agent</text>
<text x="708" y="540" class="muted" font-size="14">Local Codex shared daemon</text>
<path d="M 825 460 V 410 H 500 V 372" fill="none" stroke="#8394aa" stroke-width="2" marker-end="url(#arrow)"/>
<text x="706" y="596" class="muted" font-size="14">Codex login and execution stay local</text>
<text x="330" y="437" class="muted" font-size="14">Agents establish outbound WSS connections</text>
<text x="40" y="678" class="muted" font-size="14">No remote Codex listener · No Relay transcript database · No Relay cloud account</text>
</g></svg>
