name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
      - run: test -z "$(gofmt -l cmd internal web)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: make cross
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/
