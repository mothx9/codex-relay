name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
      - run: test -z "$(gofmt -l cmd internal web)"
      - run: sh -n scripts/install.sh
      - run: python3 scripts/install_test.py
      - run: go vet ./...
      - run: go test -race ./...
      - run: node web/control.test.mjs
      - run: make cross
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/
  native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path native
      - run: xcodebuild -project native/CodexRelay.xcodeproj -scheme CodexRelay -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/relay-ios-build CODE_SIGNING_ALLOWED=NO build-for-testing
